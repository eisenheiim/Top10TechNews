[project]
name = "top10technews"
version = "0.1.0"
description = "Top10TechNews — LangGraph HN + RSS tech digest UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.0",
]

[tool.vercel]
entrypoint = "app.py"
